[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pathovision"
version = "0.1.0"
description = "Whole-slide image analysis for metastasis detection in H&E lymph node sections"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
include = ["pathovision*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
